services:
  - type: web
    name: assetflow-pro
    runtime: python
    plan: free
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_PATH
        value: /var/data/assets.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: http://localhost:5173
    disk:
      name: assetflow-data
      mountPath: /var/data
      sizeGB: 1
